name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mon-budget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
